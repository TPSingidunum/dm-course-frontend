# Lokalna MariaDB za demo (samo za razvoj!). Kredencijali su lažni demo vrednosti.
# Pokretanje:  docker compose up -d     Reset:  docker compose down -v && docker compose up -d
services:
  db:
    image: mariadb:11
    container_name: dm-frontend-db
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      MARIADB_DATABASE: ${DB_NAME:-dm_local}
      MARIADB_USER: ${DB_USER:-dm_local}
      MARIADB_PASSWORD: ${DB_PASSWORD:-dm_local}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - dm-db-data:/var/lib/mysql
volumes:
  dm-db-data:
